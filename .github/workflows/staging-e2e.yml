name: Staging E2E regression

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Regression suite to run against the deployed staging site
        required: true
        default: core
        type: choice
        options:
          - core
          - all

permissions:
  contents: read

concurrency:
  group: staging-e2e
  cancel-in-progress: false

jobs:
  test:
    name: Run ${{ inputs.suite }} staging regression
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run core beta regression
        if: inputs.suite == 'core'
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://petseen-staging.pages.dev
          PLAYWRIGHT_STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          PLAYWRIGHT_STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run complete regression suite
        if: inputs.suite == 'all'
        run: npm run test:e2e:all
        env:
          PLAYWRIGHT_BASE_URL: https://petseen-staging.pages.dev
          PLAYWRIGHT_STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          PLAYWRIGHT_STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
