name: Deploy staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://pet-seen-staging.pages.dev
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SOCIAL_CARD_URL: ${{ secrets.STAGING_SOCIAL_CARD_URL }}
          VITE_MAP_STYLE_URL: ${{ secrets.STAGING_MAP_STYLE_URL }}

      - name: Deploy Cloudflare Pages project
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pet-seen-staging --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deployment URL
        run: 'echo "Staging deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"'
