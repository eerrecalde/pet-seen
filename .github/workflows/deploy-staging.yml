name: Deploy staging

on:
  workflow_run:
    workflows:
      - Quality checks
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://petseen-staging.pages.dev
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # Deploy exactly the commit that passed Quality checks, rather than a
          # newer commit which may have arrived while this workflow was queued.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SOCIAL_CARD_URL: ${{ secrets.STAGING_SOCIAL_CARD_URL }}
          VITE_MAP_STYLE_URL: ${{ secrets.STAGING_MAP_STYLE_URL }}

      - name: Deploy Cloudflare Pages project
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=petseen-staging --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish deployment URL
        run: 'echo "Staging deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"'

  test-staging:
    name: Playwright core-loop regression
    needs: deploy
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    environment: staging
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run staging core-loop regression
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
          PLAYWRIGHT_STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          PLAYWRIGHT_STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-staging-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
